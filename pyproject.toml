[tool.ruff]
line-length = 225
target-version = "py313"
src = ["backend"]

[tool.ruff.lint]
# 与历史 flake8/pycodestyle 一致：用 line-length，不再单独卡 79
ignore = []

[tool.flake8]
max-line-length = 225
extend-ignore = ["E203", "W503"]

[tool.pylint.main]
# 与 pytest 的 pythonpath 一致：包都在 backend/ 下，而不是仓库根。
source-roots = ["backend"]

[tool.pylint.format]
max-line-length = 225

[tool.pycodestyle]
max-line-length = 225

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
