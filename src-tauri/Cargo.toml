[package]
name = "chatvein"
version = "0.1.0"
description = "ChatVein — React UI, Rust message layer, Python backend"
authors = ["you"]
edition = "2021"

# The library is what Tauri compiles; `main.rs` just calls into it.
[lib]
name = "chatvein_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "~2.6"
serde = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
