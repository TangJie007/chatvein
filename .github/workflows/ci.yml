name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  harness:
    name: Harness 红线 + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 架构红线（chatvein 零 electron；app forge 不直引 LangChain）
        run: pnpm check

      - name: 构建能力包
        run: pnpm build:harness

      - name: 能力包单测
        run: pnpm test:harness
